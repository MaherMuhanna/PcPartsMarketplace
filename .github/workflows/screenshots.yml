name: Screenshots

# Starts the whole stack with Docker Compose (exactly what a reviewer runs), signs in as each demo
# role with Playwright, and commits the pictures in docs/screenshots to the same branch.
# Run it from the Actions tab (Run workflow) after a UI change; it also runs when the capture script changes.

on:
  workflow_dispatch:
  push:
    branches: ['phase-*']
    paths:
      - scripts/screenshots/**
      - .github/workflows/screenshots.yml

permissions:
  contents: write   # to commit the new screenshots

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture README screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Start the stack (docker compose up)
        run: |
          # Throwaway values for a CI-only stack; nothing here is a real secret.
          printf 'SA_PASSWORD=Ci_Only_Passw0rd!\nJWT_SIGNING_KEY=screenshots-only-signing-key-0123456789abcdef\n' > .env
          docker compose up -d --build

      # The API seeds the demo accounts, offers and orders before it starts listening,
      # so a healthy API plus a responding UI means the demo data is in place.
      - name: Wait for API and UI
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/health > /dev/null && curl -fsS http://localhost:8081/ > /dev/null; then
              echo "Stack is up"; exit 0
            fi
            sleep 5
          done
          docker compose logs --tail 200; exit 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Playwright (Chromium)
        working-directory: scripts/screenshots
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Capture
        run: node scripts/screenshots/capture.mjs docs/screenshots

      - name: Commit screenshots
        run: |
          git add docs/screenshots
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update README screenshots"
          git push

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: docs/screenshots/
          if-no-files-found: ignore

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 300
